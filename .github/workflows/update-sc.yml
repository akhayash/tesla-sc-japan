name: Update Supercharger data

on:
  schedule:
    - cron: "0 18 * * 0" # Mondays 03:00 JST
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild stats even if no site changed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: update-sc
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore census / boundary downloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-inputs-v1

      - run: pip install -r requirements.txt

      - name: Fetch Superchargers and rebuild if changed
        id: update
        working-directory: pipeline
        run: python update_sc.py ${{ inputs.force && '--force' || '' }}

      - name: Commit and publish
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/sc.geojson docs/data/admin_stats.json
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          printf 'Update Supercharger data (%s)\n\n%s\n' "$(date -u +%F)" "$SUMMARY" > /tmp/msg.txt
          git commit -F /tmp/msg.txt
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
